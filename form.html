<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Evard Mabounda">
    <meta name="description" content="Building a beautiful form.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="productName">Product Name</label>
            <select name="productName" id="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <label for="overall-rating">Overall Rating <span class="required">*</span><label>
                        <div class="rating-container">
                            <!-- <label for="star1">☆</label>
                            <input type="radio" id="star1" name="rating" value="1" required>

                            <label for="star2">☆☆</label>
                            <input type="radio" id="star2" name="rating" value="2" required>

                            <label for="star3">☆☆☆</label>
                            <input type="radio" id="star3" name="rating" value="3" required>

                            <label for="star4">☆☆☆☆</label>
                            <input type="radio" id="star4" name="rating" value="4" required> -->

                            <label for="star1">
                                ☆
                                <input type="radio" id="star1" name="rating" value="1" required>
                            </label>

                            <label for="star2">
                                ☆☆
                                <input type="radio" id="star2" name="rating" value="2" required>
                            </label>

                            <label for="star3">
                                ☆☆☆
                                <input type="radio" id="star3" name="rating" value="3" required>
                            </label>

                            <label for="star4">
                                ☆☆☆☆
                                <input type="radio" id="star4" name="rating" value="4" required>
                            </label>


                            <label for="star5">
                                ☆☆☆☆☆
                                <input type="radio" id="star5" name="rating" value="5" required>
                            </label>
                        </div>
            </fieldset>

            <div>
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>


            <fieldset>
                <legend>Which features did you find useful? (Check all that apply)</legend>
                <!-- <label><input type="checkbox" name="features" value="durability"> Durability</label>
                <label><input type="checkbox" name="features" value="ease"> Ease of Use</label>
                <label><input type="checkbox" name="features" value="performance"> Performance</label> -->
                <!-- <label><input type="checkbox" name="features" value="design"> Design</label> -->


                <!-- testing real things -->
                <label for="durability"><input type="checkbox" id="durability" name="features" value="durability"> Durability</label>
                <label for="ease"><input type="checkbox" id="ease" name="features" value="ease"> Ease of Use</label>
                <label for="performance"><input type="checkbox" id="performance" name="features" value="performance"> Performance</label>
                <label for="design"><input type="checkbox" id="design" name="features" value="design"> Design</label>
            </fieldset>

            <div class="inner-container">
                <label for="review">Written Review (Optional)</label>
                <textarea id="review" name="review" rows="4"></textarea>
            </div>

            <div class="inner-container">
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName">
            </div>


            <input type="submit" value="Post Review">
        </form>
    </main>




    <!-- footer -->

    <footer>
        <p>&copy;<span id="currentyear"></span> 🌴 Evard Dieuveille Mabounda 🌴 Cape Town</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
